<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#151311">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Handpan">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>D Kurd 10 Handpan</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(circle at 50% 15%,#29241f 0,#171513 48%,#0d0c0b 100%);color:#f4efe8;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif}
body{min-height:100dvh;padding:max(env(safe-area-inset-top),12px) 14px max(env(safe-area-inset-bottom),12px)}
.app{max-width:780px;margin:0 auto}
.head{padding:8px 2px 8px;text-align:center}
h1{font-size:19px;font-weight:600;letter-spacing:.02em;margin:0 0 4px}.sub{font-size:12px;color:#a9a198}
.controls{display:flex;gap:12px;flex-wrap:wrap;padding:8px 0 12px}.control{display:grid;grid-template-columns:auto minmax(110px,1fr) auto;gap:8px;align-items:center;min-width:215px;flex:1;padding:8px 10px;border:1px solid rgba(255,255,255,.08);background:rgba(0,0,0,.16);border-radius:12px;backdrop-filter:blur(8px)}.control.toggleControl{grid-template-columns:1fr auto;min-width:215px}.toggleText{display:flex;flex-direction:column;gap:2px}.toggleText small{font-size:10px;color:#92897f}.switch{position:relative;width:46px;height:27px;display:inline-block}.switch input{opacity:0;width:0;height:0}.sliderToggle{position:absolute;inset:0;border-radius:999px;background:#4a4641;transition:.18s;border:1px solid rgba(255,255,255,.12)}.sliderToggle:before{content:"";position:absolute;width:21px;height:21px;left:2px;top:2px;border-radius:50%;background:#eee7de;box-shadow:0 1px 4px rgba(0,0,0,.5);transition:.18s}.switch input:checked+.sliderToggle{background:#9b7b55}.switch input:checked+.sliderToggle:before{transform:translateX(19px)}
.control label{font-size:13px}.control output{font-size:12px;color:#bbb2a7;min-width:38px;text-align:right}input[type=range]{width:100%;accent-color:#d8c5a8}
.stage{position:relative;width:min(94vw,650px);aspect-ratio:1;margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none;filter:drop-shadow(0 20px 28px rgba(0,0,0,.48))}
.pan{position:absolute;inset:1.5%;border-radius:50%;overflow:hidden;transform-origin:50% 50%;background:
 radial-gradient(circle at 38% 24%,rgba(255,222,175,.42) 0 7%,transparent 28%),
 radial-gradient(circle at 72% 62%,rgba(40,72,92,.18),transparent 32%),
 radial-gradient(circle at 47% 52%,#766452 0,#5a4c3f 38%,#3b342d 70%,#241f1b 100%);
 border:3px solid #28221d;box-shadow:inset 0 0 0 2px #6b5847,inset 0 0 48px rgba(255,204,142,.12),inset 0 0 90px rgba(0,0,0,.6)}
.pan::before{content:"";position:absolute;inset:0;background-image:url('metal-texture.png');background-size:cover;background-position:center;background-repeat:no-repeat;mix-blend-mode:soft-light;opacity:.46;filter:contrast(1.08) saturate(.84);pointer-events:none}
.pan::after{content:"";position:absolute;inset:2.2%;border-radius:50%;border:1px solid rgba(255,230,197,.2);box-shadow:inset 0 0 0 1px rgba(0,0,0,.65),inset 0 0 24px rgba(0,0,0,.3);pointer-events:none}
.shellHit{position:absolute;inset:1.5%;border:0;border-radius:50%;background:transparent;z-index:1;touch-action:none}
.note{position:absolute;width:20%;aspect-ratio:1.12;transform:translate(-50%,-50%);border-radius:50% / 46%;border:0;background:
 radial-gradient(ellipse at 46% 38%,rgba(232,206,169,.32) 0 8%,rgba(112,89,70,.12) 20%,rgba(41,34,29,.3) 56%,rgba(10,9,8,.46) 78%,rgba(0,0,0,.08) 100%);
 box-shadow:inset 0 7px 14px rgba(255,226,184,.13),inset 0 -12px 20px rgba(0,0,0,.52),0 3px 8px rgba(0,0,0,.25);color:#f3eee8;font-size:clamp(12px,3vw,18px);font-weight:600;display:flex;align-items:center;justify-content:center;padding:0;z-index:3;overflow:hidden;touch-action:none;-webkit-tap-highlight-color:transparent;text-shadow:0 1px 3px #000}
.note::before{content:"";position:absolute;width:43%;height:49%;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50% / 44%;background:radial-gradient(ellipse at 38% 30%,#c8ab86 0 5%,#8c7259 18%,#493b31 54%,#1f1a17 100%);box-shadow:inset 3px 4px 8px rgba(255,225,184,.26),inset -5px -6px 9px rgba(0,0,0,.7),0 2px 3px rgba(0,0,0,.45)}
.note::after{content:"";position:absolute;inset:0;background-image:url('metal-texture.png');background-size:cover;background-position:center;background-repeat:no-repeat;mix-blend-mode:overlay;opacity:.20;pointer-events:none}
.note.ding{width:30%;aspect-ratio:1.06;border-radius:50% / 47%;padding:0;background:radial-gradient(ellipse at 47% 43%,rgba(204,175,139,.24),rgba(53,43,36,.4) 48%,rgba(5,5,5,.5) 100%);box-shadow:inset 0 9px 20px rgba(255,219,171,.12),inset 0 -18px 28px rgba(0,0,0,.58),0 4px 10px rgba(0,0,0,.32)}
.note.ding::before{width:48%;height:54%;left:50%;top:50%;transform:translate(-50%,-50%);border-radius:50% / 44%;background:radial-gradient(ellipse at 38% 28%,#d0b08a 0 5%,#9a7b5d 18%,#564335 52%,#1c1714 100%)}
.label{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:6;pointer-events:none;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;text-align:center;opacity:1;transition:opacity .15s}.hideNoteNames .label{opacity:0}.label small{font-size:.52em;font-weight:400;opacity:.7;margin-top:2px}.note.hit{filter:brightness(1.25)}
.zoneGuide{position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:5;opacity:0;transition:opacity .15s}.showGuides .zoneGuide{opacity:1}.zoneGuide::before{content:"";position:absolute;inset:4%;border:1px solid rgba(246,236,218,.62);border-radius:inherit;box-shadow:0 0 0 1px rgba(0,0,0,.18)}.zoneGuide::after{content:"";position:absolute;width:48%;height:54%;left:50%;top:50%;transform:translate(-50%,-50%);border:1px solid rgba(246,236,218,.72);border-radius:50% / 44%;box-shadow:0 0 0 1px rgba(0,0,0,.18)}.note:not(.ding) .zoneGuide::after{width:43%;height:49%}
.status{text-align:center;font-size:12px;color:#aaa197;padding:10px 0 5px;min-height:28px}.tip{text-align:center;font-size:11px;color:#716b64;padding-bottom:8px}
@media(max-width:520px){.controls{gap:8px}.control{min-width:100%}}
</style>
</head>
<body>
<main class="app">
<div class="head"><h1>D Kurd 10 Handpan</h1><div class="sub">Photorealistic surface · centred oval dimples · optional guidelines and note names</div></div>
<div class="controls">
<div class="control"><label for="sustain">Sustain</label><input id="sustain" type="range" min="0" max="1" step=".01" value=".68"><output id="sustainOut">68%</output></div>
<div class="control"><label for="tone">Tone</label><input id="tone" type="range" min="0" max="1" step=".01" value=".78"><output id="toneOut">78%</output></div>
<div class="control"><label for="rotation">Rotation</label><input id="rotation" type="range" min="-180" max="180" step="1" value="0"><output id="rotationOut">0°</output></div>
<div class="control toggleControl"><div class="toggleText"><label for="guides">Guidelines</label><small>Show centre and shoulder zones</small></div><label class="switch"><input id="guides" type="checkbox" checked><span class="sliderToggle"></span></label></div>
<div class="control toggleControl"><div class="toggleText"><label for="noteNames">Note Names</label><small>Show or hide note labels</small></div><label class="switch"><input id="noteNames" type="checkbox" checked><span class="sliderToggle"></span></label></div>
</div>
<div id="stage" class="stage"><div id="pan" class="pan"></div><button id="shell" class="shellHit" type="button" aria-label="Handpan shell percussion"></button><button class="note ding" type="button" data-note="D3" data-freq="146.832" style="left:50%;top:50%"><span class="zoneGuide"></span><span class="label">D3<small>Ding</small></span></button></div>
<div id="status" class="status" aria-live="polite">Tap a note centre, shoulder or the shell</div><div class="tip">For best response on iPad, open in Safari and add to Home Screen.</div>
</main>
<script>
(()=>{
const stage=document.getElementById('stage'),pan=document.getElementById('pan'),shell=document.getElementById('shell'),status=document.getElementById('status');
const sustain=document.getElementById('sustain'),tone=document.getElementById('tone'),rotation=document.getElementById('rotation'),guides=document.getElementById('guides'),noteNames=document.getElementById('noteNames');
const sustainOut=document.getElementById('sustainOut'),toneOut=document.getElementById('toneOut'),rotationOut=document.getElementById('rotationOut');
const notes=[['A3',220],['Bb3',233.082],['D4',293.665],['F4',349.228],['A4',440],['C5',523.251],['G4',391.995],['E4',329.628],['C4',261.626]],outer=[],radius=35,baseStart=90;
notes.forEach(n=>{const b=document.createElement('button');b.type='button';b.className='note';b.dataset.note=n[0];b.dataset.freq=n[1];b.innerHTML='<span class="zoneGuide"></span><span class="label">'+n[0]+'</span>';stage.appendChild(b);outer.push(b)});
function positionNotes(){const rot=+rotation.value||0;outer.forEach((b,i)=>{const a=(baseStart+i*40+rot)*Math.PI/180;b.style.left=50+radius*Math.cos(a)+'%';b.style.top=50+radius*Math.sin(a)+'%';b.style.transform='translate(-50%,-50%)'});pan.style.transform='rotate('+rot+'deg)';rotationOut.value=Math.round(rot)+'°'}
rotation.addEventListener('input',positionNotes);positionNotes();sustain.addEventListener('input',()=>sustainOut.value=Math.round(+sustain.value*100)+'%');tone.addEventListener('input',()=>toneOut.value=Math.round(+tone.value*100)+'%');
function syncGuides(){stage.classList.toggle('showGuides',guides.checked)}guides.addEventListener('change',syncGuides);syncGuides();
function syncNoteNames(){stage.classList.toggle('hideNoteNames',!noteNames.checked)}noteNames.addEventListener('change',syncNoteNames);syncNoteNames();
let ctx,master,reverb,wet,warmed=false;const bank=new Map(),voices=[];const POOL=28;
function init(){if(ctx){if(ctx.state==='suspended')ctx.resume();return true}const AC=window.AudioContext||window.webkitAudioContext;if(!AC){status.textContent='Audio is not supported on this device.';return false}ctx=new AC({latencyHint:'interactive'});master=ctx.createGain();master.gain.value=.8;master.connect(ctx.destination);reverb=ctx.createConvolver();wet=ctx.createGain();wet.gain.value=.035;const len=Math.floor(ctx.sampleRate*1.3),imp=ctx.createBuffer(2,len,ctx.sampleRate);for(let c=0;c<2;c++){const d=imp.getChannelData(c);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,5)*.18}reverb.buffer=imp;reverb.connect(wet).connect(master);for(let i=0;i<POOL;i++){const f=ctx.createBiquadFilter(),a=ctx.createGain();f.type='lowpass';f.Q.value=.32;a.gain.value=0;f.connect(a);a.connect(master);a.connect(reverb);voices.push({f,a,busyUntil:0})}return true}
function getVoice(now){let v=voices.find(x=>x.busyUntil<=now+.002);return v||voices.reduce((a,b)=>a.busyUntil<b.busyUntil?a:b)}
function renderSample(freq,isDing,zone){const sr=ctx.sampleRate,dur=isDing?5.3:4.8,N=Math.floor(sr*dur),buf=ctx.createBuffer(2,N,sr),L=buf.getChannelData(0),R=buf.getChannelData(1);let m;if(isDing&&zone==='centre')m=[[1,1,4.5],[2.01,.19,3],[2.96,.09,2],[4.09,.04,1.3],[5.2,.018,.85]];else if(isDing)m=[[1,.8,3.8],[2.01,.3,2.7],[2.97,.18,1.9],[4.11,.1,1.25],[5.24,.045,.8]];else if(zone==='centre')m=[[1,.94,4],[2.005,.19,2.7],[2.93,.085,1.8],[4.06,.04,1.15],[5.17,.017,.72]];else m=[[1,.77,3.45],[2.01,.3,2.4],[2.94,.18,1.65],[4.08,.1,1.08],[5.31,.045,.68]];for(let i=0;i<N;i++){const t=i/sr;let l=0,r=0;for(let j=0;j<m.length;j++){const q=m[j],env=Math.exp(-t/q[2])*(1-Math.exp(-t*(zone==='centre'?180:300))),ph=2*Math.PI*freq*q[0]*t+j*.67;l+=Math.sin(ph)*q[1]*env;r+=Math.sin(ph+j*.018)*q[1]*env}const strike=Math.exp(-t*(zone==='centre'?72:55)),noise=(Math.random()*2-1)*strike*(zone==='centre'?.055:.13);L[i]=Math.tanh((l+noise)*.74);R[i]=Math.tanh((r+noise*.9)*.74)}return buf}
function sample(name,freq,ding,zone){const k=name+'-'+zone;if(!bank.has(k))bank.set(k,renderSample(freq,ding,zone));return bank.get(k)}
function cutoff(){return 900*Math.pow(18,+tone.value)}function sustainTime(d){return(d?1.1:.9)+(+sustain.value)*(d?5.1:4.5)}
function warmAll(){if(warmed||!ctx)return;warmed=true;setTimeout(()=>{const all=[['D3',146.832,true],...notes.map(n=>[n[0],n[1],false])];let i=0;function step(){const end=Math.min(i+2,all.length);for(;i<end;i++){const n=all[i];sample(n[0],n[1],n[2],'centre');sample(n[0],n[1],n[2],'shoulder')}if(i<all.length)setTimeout(step,0);else status.textContent='Ready for fast playing'}step()},20)}
function playNote(name,freq,ding,zone,pressure){if(!init())return;const now=ctx.currentTime,p=Math.max(.34,Math.min(1,pressure||.72)),v=getVoice(now),src=ctx.createBufferSource(),st=sustainTime(ding);src.buffer=sample(name,freq,ding,zone);v.f.frequency.setValueAtTime(cutoff(),now);v.a.gain.cancelScheduledValues(now);v.a.gain.setValueAtTime(.0001,now);v.a.gain.exponentialRampToValueAtTime(.68*p,now+.003);v.a.gain.setValueAtTime(.68*p,now+.016);v.a.gain.exponentialRampToValueAtTime(.0001,now+st);src.connect(v.f);src.start(now);src.stop(now+Math.min(src.buffer.duration,st+.05));v.busyUntil=now+st+.06;warmAll()}
function playShell(x,y,pressure){if(!init())return;const dx=x-.5,dy=y-.5,r=Math.min(1,Math.sqrt(dx*dx+dy*dy)/.5),now=ctx.currentTime,p=Math.max(.35,Math.min(1,pressure||.65)),len=Math.floor(ctx.sampleRate*.18),buf=ctx.createBuffer(1,len,ctx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<len;i++){const t=i/ctx.sampleRate;d[i]=(Math.random()*2-1)*Math.exp(-t/(.022+.025*(1-r)))*.72}const src=ctx.createBufferSource(),bp=ctx.createBiquadFilter(),g=ctx.createGain();src.buffer=buf;bp.type='bandpass';bp.frequency.value=480+r*1550;bp.Q.value=.85;g.gain.value=(.095+.09*r)*p;src.connect(bp).connect(g).connect(master);src.start(now);warmAll()}
stage.addEventListener('pointerdown',e=>{const n=e.target.closest('.note');if(n){e.preventDefault();const b=n.getBoundingClientRect(),x=(e.clientX-(b.left+b.width/2))/(b.width/2),y=(e.clientY-(b.top+b.height/2))/(b.height/2),z=Math.sqrt(x*x+y*y)<.48?'centre':'shoulder';playNote(n.dataset.note,+n.dataset.freq,n.classList.contains('ding'),z,e.pressure>0?e.pressure:.72);n.classList.add('hit');setTimeout(()=>n.classList.remove('hit'),70);status.textContent=n.dataset.note+' · '+z;return}if(e.target===shell){e.preventDefault();const b=shell.getBoundingClientRect();playShell((e.clientX-b.left)/b.width,(e.clientY-b.top)/b.height,e.pressure>0?e.pressure:.65);status.textContent='Soft shell percussion'}});
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
})();
</script>
</body></html>
